version: '3.8'

services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-brain-mem-2026}
    volumes:
      - neo4j_data:/data

  brain-mem:
    build: .
    ports:
      - "8100:8100"
    depends_on:
      - neo4j
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-brain-mem-2026}
    volumes:
      - ./config.yaml:/app/config.yaml
      - brain_mem_data:/app/data

volumes:
  neo4j_data:
  brain_mem_data:
